<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Encrypted Offline Image & GIF Gallery (IndexedDB + AES-GCM) — Folders</title>
  <link rel="icon" href="data:," />
  <style>
    :root{--bg:#0f1226;--panel:#161a36;--soft:#222651;--accent:#7c8cff;--accent-2:#50e3c2;--text:#eaf0ff;--muted:#9aa4d7}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;background:linear-gradient(180deg,var(--bg),#0b0e1e 60%);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    header{position:sticky;top:0;z-index:5;background:rgba(15,18,38,.8);backdrop-filter:blur(8px);border-bottom:1px solid #1f2350}
    .wrap{max-width:1100px;margin:0 auto;padding:16px} h1{margin:0;font-size:20px;letter-spacing:.3px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    button,.file-label{appearance:none;border:1px solid #2b2f66;background:linear-gradient(180deg,#1b2050,#151a44);color:var(--text);padding:10px 14px;border-radius:14px;cursor:pointer;transition:.2s;box-shadow:0 1px 0 #2a2f62 inset,0 8px 24px rgba(0,0,0,.2)}
    button:hover,.file-label:hover{transform:translateY(-1px);border-color:#3940a5} button:disabled{opacity:.5;cursor:not-allowed}
    .file-label{display:inline-flex;align-items:center;gap:8px} input[type=file]{display:none}
    .stats{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    main{max-width:1100px;margin:14px auto 60px;padding:0 16px}
    .dropzone{border:2px dashed #2c326e;border-radius:18px;padding:22px;text-align:center;color:var(--muted);background:rgba(124,140,255,.06)}
    .dropzone.dragover{border-color:var(--accent);background:rgba(124,140,255,.12);color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:16px}
    .card{position:relative;background:linear-gradient(180deg,#161a36,#121638);border:1px solid #22265a;border-radius:16px;overflow:hidden}
    .thumb{width:100%;height:150px;object-fit:cover;background:#0a0d20;display:block}
    .meta{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;color:var(--muted);font-size:12px}
    .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
    .badge{border:1px solid #2b2f66;border-radius:999px;padding:2px 8px}
    .select{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);padding:6px;border-radius:10px}
    .actions{display:flex;gap:8px;padding:8px;border-top:1px solid #22265a}
    .actions button{flex:1;padding:8px;border-radius:10px}
    .empty{color:var(--muted);text-align:center;padding:28px}
    footer{position:fixed;inset:auto 0 0 0;background:rgba(15,18,38,.9);backdrop-filter:blur(8px);border-top:1px solid #1f2350}
    .footer-wrap{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
    dialog{border:none;border-radius:16px;padding:0;max-width:90vw;background:#0e1333;color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .modal-head{padding:12px 16px;border-bottom:1px solid #22265a;display:flex;justify-content:space-between;align-items:center}
    .modal-body{padding:12px} .modal-body img{max-width:90vw;max-height:70vh;display:block}
    .close-x{background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer}
    .hidden{display:none}

    /* folders UI */
    .folders-row{display:flex;gap:8px;align-items:center;margin-top:12px}
    .folder-pill{padding:8px 12px;border-radius:999px;border:1px solid #22265a;background:linear-gradient(180deg,#151834,#0e1130);cursor:pointer}
    .folder-pill.active{outline:2px solid rgba(124,140,255,.18)}
    .folder-controls{display:flex;gap:8px;align-items:center;margin-left:auto}
    .small-input{padding:8px 10px;border-radius:10px;border:1px solid #2b2f66;background:transparent;color:var(--text)}
    .move-select{padding:8px;border-radius:10px;border:1px solid #2b2f66;background:linear-gradient(180deg,#151a44,#0f1330);color:var(--text)}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Encrypted Offline Image & GIF Gallery <span style="color:var(--accent)">— stored encrypted in your browser</span></h1>
      <div class="toolbar">
        <label class="file-label" title="Choose images">
          <input id="fileInput" type="file" accept="image/*" multiple />
          📤 Upload Images
        </label>
        <label class="file-label" title="Import a previously exported .json file">
          <input id="importInput" type="file" accept="application/json" />
          📥 Import (.json)
        </label>

        <button id="exportSel" disabled>💾 Export Selected</button>
        <button id="exportAll" disabled>💾 Export All</button>
        <button id="selectAll" disabled>☑️ Select All</button>
        <button id="clearSel" disabled>🗑️ Delete Selected</button>
        <button id="clearAll" disabled>🧹 Clear All</button>

        <div class="stats" id="stats">0 items · 0 MB used</div>
      </div>

      <!-- folders row -->
      <div class="folders-row" id="foldersRow">
        <!-- generated folder pills will appear here -->
        <div style="display:flex;gap:8px;align-items:center">
          <input id="newFolderName" class="small-input" placeholder="New folder name" />
          <button id="createFolder">📁 Create Folder</button>
        </div>
        <div class="folder-controls">
          <select id="moveToSelect" class="move-select"><option value="">Move selected to...</option></select>
          <button id="renameFolderBtn" disabled>✏️ Rename</button>
          <button id="deleteFolderBtn" disabled>🗑️ Delete Folder</button>
        </div>
      </div>

    </div>
  </header>

  <main>
    <div id="dropzone" class="dropzone">Drag & drop images/GIFs here, or use the Upload button above. Drop directly onto a folder pill to add there.</div>
    <div id="gallery" class="grid" aria-live="polite"></div>
    <div id="emptyState" class="empty hidden">No images yet. Upload or drop some to get started ✨</div>
  </main>

  <dialog id="viewer">
    <div class="modal-head">
      <div id="viewerName">Preview</div>
      <button class="close-x" onclick="viewer.close()">×</button>
    </div>
    <div class="modal-body"><img id="viewerImg" alt="Preview" /></div>
  </dialog>

  <script>
  // ------------------ Config / DB names ---------------------
  const DB_NAME = 'offline-image-gallery-v1-encrypted';
  const STORE = 'images';
  const META = 'meta';
  const DB_VERSION = 1;

  // ------------------ Crypto settings -----------------------
  const PBKDF2_ITERATIONS = 200000;
  const SALT_KEY = 'salt'; // stored in meta store
  const FOLDERS_KEY = 'folders';
  const ENC_ALGO = { name: 'AES-GCM', length: 256 };
  let cryptoKey = null;
  let salt = null;

  // ------------------ IndexedDB helpers ---------------------
  let db;
  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if(!d.objectStoreNames.contains(STORE)){
          const os = d.createObjectStore(STORE,{keyPath:'id'});
          os.createIndex('by_name','name',{unique:false});
        }
        if(!d.objectStoreNames.contains(META)){
          d.createObjectStore(META, { keyPath: 'k' });
        }
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }

  function txObjectStore(mode='readonly'){
    const t = db.transaction([STORE], mode);
    return t.objectStore(STORE);
  }
  function txMetaStore(mode='readonly'){
    const t = db.transaction([META], mode);
    return t.objectStore(META);
  }

  function putImageRecord(record){
    return new Promise((res,rej)=>{ const r = txObjectStore('readwrite').put(record); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error) });
  }
  function deleteImageRecord(id){
    return new Promise((res,rej)=>{ const r = txObjectStore('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error) });
  }
  function getAllRecords(){
    return new Promise((res,rej)=>{ const r = txObjectStore('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error) });
  }
  function getManyRecords(ids){
    const store = txObjectStore('readonly');
    return Promise.all(ids.map(id=>new Promise((res,rej)=>{ const r = store.get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)})));
  }
  function metaGet(key){
    return new Promise((res,rej)=>{ const r = txMetaStore('readonly').get(key); r.onsuccess=()=>res(r.result? r.result.v : undefined); r.onerror=()=>rej(r.error) });
  }
  function metaPut(key,value){
    return new Promise((res,rej)=>{ const r = txMetaStore('readwrite').put({k:key,v:value}); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error) });
  }

  // ------------------ Binary helpers ------------------------
  const $ = sel => document.querySelector(sel);
  const fmtBytes = n => (n? (n/1024/1024).toFixed(2):'0.00')+ ' MB';
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : (Date.now()+Math.random()).toString(36);
  async function blobToArrayBuffer(blob){ return await blob.arrayBuffer(); }
  function arrayBufferToBlob(ab, type){ return new Blob([ab], { type: type || 'application/octet-stream' }); }
  function u8aToBase64(u8a){ let binary = ''; const len = u8a.byteLength; for(let i=0;i<len;i++) binary += String.fromCharCode(u8a[i]); return btoa(binary); }
  function base64ToU8a(b64){ const bin = atob(b64); const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i); return u8; }

  // ------------------ Crypto core ---------------------------
  async function deriveKeyFromPassword(password, saltBytes){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    const derived = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      ENC_ALGO,
      false,
      ['encrypt','decrypt']
    );
    return derived;
  }

  async function ensureSaltAndKey(password){
    const metaSalt = await metaGet(SALT_KEY);
    if(metaSalt){
      salt = Uint8Array.from(metaSalt);
    }else{
      const s = crypto.getRandomValues(new Uint8Array(16));
      salt = s;
      await metaPut(SALT_KEY, Array.from(s));
    }
    cryptoKey = await deriveKeyFromPassword(password, salt);
  }

  async function encryptArrayBuffer(ab){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, cryptoKey, ab);
    return { iv: Array.from(iv), cipher: cipher };
  }

  async function decryptToArrayBuffer(ivArr, cipherAB){
    const iv = new Uint8Array(ivArr);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, cryptoKey, cipherAB);
    return plain;
  }

  // ------------------ DOM elements & state -------------------
  const fileInput = $('#fileInput');
  const importInput = $('#importInput');
  const gallery = $('#gallery');
  const dropzone = $('#dropzone');
  const emptyState = $('#emptyState');
  const stats = $('#stats');
  const exportSelBtn = $('#exportSel');
  const exportAllBtn = $('#exportAll');
  const selectAllBtn = $('#selectAll');
  const clearSelBtn = $('#clearSel');
  const clearAllBtn = $('#clearAll');
  const viewer = $('#viewer');
  const viewerImg = $('#viewerImg');
  const viewerName = $('#viewerName');

  const newFolderNameInput = $('#newFolderName');
  const createFolderBtn = $('#createFolder');
  const foldersRow = $('#foldersRow');
  const moveToSelect = $('#moveToSelect');
  const renameFolderBtn = $('#renameFolderBtn');
  const deleteFolderBtn = $('#deleteFolderBtn');

  let selections = new Set();
  let folders = []; // { id, name }
  let currentFolderId = null; // null = All items

  // ------------------ Folders persistence -------------------
  async function loadFolders(){
    const f = await metaGet(FOLDERS_KEY) || [];
    folders = f;
    renderFolderPills();
    rebuildMoveSelect();
  }
  async function saveFolders(){ await metaPut(FOLDERS_KEY, folders); renderFolderPills(); rebuildMoveSelect(); }
  function createFolder(name){ const id = uid(); folders.push({ id, name }); saveFolders(); return id; }
  function renameFolder(id, name){ const idx = folders.findIndex(f=>f.id===id); if(idx>=0){ folders[idx].name = name; saveFolders(); }}
  function deleteFolder(id){ // move images in folder to null (Unsorted) then remove folder
    return new Promise(async (res,rej)=>{
      try{
        const all = await getAllRecords();
        for(const it of all){ if(it.folderId === id){ it.folderId = null; await putImageRecord(it); }}
        folders = folders.filter(f=>f.id!==id);
        await saveFolders();
        res();
      }catch(e){ rej(e); }
    });
  }

  function renderFolderPills(){
    // rebuild visible pills (we keep the create inputs in DOM so only update pills area)
    // We'll place pills before the create controls, so find existing pills and remove them
    // Simple: clear all non-controls in foldersRow then add pills at left
    const pills = Array.from(foldersRow.querySelectorAll('.folder-pill')); pills.forEach(p=>p.remove());
    // Add special pills: All, Unsorted
    const allPill = document.createElement('div'); allPill.className = 'folder-pill'+(currentFolderId===null?' active':''); allPill.textContent = 'All Items'; allPill.onclick = ()=>{ currentFolderId = null; refresh(); renderFolderPills(); };
    foldersRow.insertBefore(allPill, foldersRow.firstChild);
    const unsortedPill = document.createElement('div'); unsortedPill.className = 'folder-pill'+(currentFolderId==='__unsorted__'?' active':''); unsortedPill.textContent = 'Unsorted'; unsortedPill.onclick = ()=>{ currentFolderId = '__unsorted__'; refresh(); renderFolderPills(); };
    foldersRow.insertBefore(unsortedPill, foldersRow.firstChild.nextSibling);

    // user folders
    for(const f of folders){
      const el = document.createElement('div');
      el.className = 'folder-pill'+(currentFolderId===f.id?' active':'');
      el.textContent = f.name;
      el.title = `Folder: ${f.name}`;
      el.onclick = ()=>{ currentFolderId = f.id; refresh(); renderFolderPills(); };
      // support dropping files directly onto pill
      el.addEventListener('dragover', e=>{ e.preventDefault(); el.style.opacity = '0.8'; });
      el.addEventListener('dragleave', ()=>{ el.style.opacity = ''; });
      el.addEventListener('drop', async e=>{ e.preventDefault(); el.style.opacity = ''; if(e.dataTransfer.files?.length){ await ingestFiles(e.dataTransfer.files, f.id); }});
      foldersRow.insertBefore(el, foldersRow.children[2] || null);
    }

    // update rename/delete button enabled state based on currentFolderId
    const isUserFolder = folders.some(ff=>ff.id===currentFolderId);
    renameFolderBtn.disabled = !isUserFolder;
    deleteFolderBtn.disabled = !isUserFolder;
  }

  function rebuildMoveSelect(){
    moveToSelect.innerHTML = '<option value="">Move selected to...</option>';
    moveToSelect.appendChild(new Option('Unsorted','__unsorted__'));
    for(const f of folders){ moveToSelect.appendChild(new Option(f.name, f.id)); }
  }

  // ------------------ Rendering / Refresh --------------------
  async function refresh(){
    const items = await getAllRecords();
    gallery.innerHTML = '';
    let totalBytes = 0;
    items.forEach(it=> totalBytes += (it.size||0));
    stats.textContent = `${items.length} items · ${fmtBytes(totalBytes)}`;

    exportAllBtn.disabled = items.length === 0;
    clearAllBtn.disabled = items.length === 0;
    selectAllBtn.disabled = items.length === 0;
    emptyState.classList.toggle('hidden', items.length !== 0);

    // filter by currentFolderId
    let filtered = items.slice();
    if(currentFolderId === '__unsorted__') filtered = filtered.filter(it=>!it.folderId);
    else if(currentFolderId) filtered = filtered.filter(it=> it.folderId === currentFolderId);

    // latest first
    filtered.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));

    for(const it of filtered){
      let blob;
      try{
        const plainAB = await decryptToArrayBuffer(it.iv, it.cipher);
        blob = arrayBufferToBlob(plainAB, it.type || 'image/*');
      }catch(err){
        console.error('Decryption failed for', it.id, err);
        const cardErr = document.createElement('div');
        cardErr.className = 'card';
        cardErr.innerHTML = `<div style="padding:14px;color:var(--muted)">Unable to decrypt "${it.name}" — maybe wrong password.</div>`;
        gallery.appendChild(cardErr);
        continue;
      }

      const url = URL.createObjectURL(blob);
      const card = document.createElement('div');
      card.className = 'card';
      const folderLabel = it.folderId ? (folders.find(f=>f.id===it.folderId)?.name || 'Folder') : '';
      card.innerHTML = `
        <div class="select"><input type="checkbox" aria-label="Select ${it.name}" ${selections.has(it.id)?'checked':''}></div>
        <img class="thumb" src="${url}" alt="${it.name}">
        <div class="meta">
          <div style="display:flex;gap:8px;align-items:center;min-width:0">
            <div class="name" title="${it.name}">${it.name}</div>
            ${folderLabel?`<div class="badge" title="Folder">${folderLabel}</div>`:''}
          </div>
          <div class="badge">${(it.type||'image').split('/').pop().toUpperCase()}</div>
        </div>
        <div class="actions">
          <button data-act="view">View</button>
          <button data-act="del">Delete</button>
          <button data-act="dl">Download</button>
        </div>
      `;

      const cb = card.querySelector('input[type=checkbox]');
      cb.addEventListener('change', () => {
        if(cb.checked) selections.add(it.id); else selections.delete(it.id);
        updateSelectionButtons();
      });

      card.querySelector('[data-act=view]').addEventListener('click',()=>{ viewerImg.src = url; viewerName.textContent = it.name; viewer.showModal(); });

      card.querySelector('[data-act=del]').addEventListener('click', async ()=>{ if(confirm(`Delete \"${it.name}\"?`)){ await deleteImageRecord(it.id); selections.delete(it.id); refresh(); } });

      card.querySelector('[data-act=dl]').addEventListener('click',()=>{ const a = document.createElement('a'); a.href = url; a.download = it.name || 'image'; a.click(); });

      card.querySelector('.thumb').addEventListener('click',()=>{ cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); });

      gallery.appendChild(card);
    }
    updateSelectionButtons();
  }

  function updateSelectionButtons(){
    const hasSel = selections.size>0;
    exportSelBtn.disabled = !hasSel;
    clearSelBtn.disabled = !hasSel;
  }

  // ------------------ Export / Import (decrypted export) ----------
  async function exportByIds(ids){
    const records = (await getManyRecords(ids)).filter(Boolean);
    const images = [];
    for(const r of records){
      try{
        const plainAB = await decryptToArrayBuffer(r.iv, r.cipher);
        const blob = arrayBufferToBlob(plainAB, r.type);
        const dataURL = await blobToDataURL(blob);
        images.push({ id: r.id, name: r.name, type: r.type, size: r.size, lastModified: r.lastModified, addedAt: r.addedAt, folderId: r.folderId||null, dataURL });
      }catch(err){
        console.error('Failed decrypt for export', r.id, err);
        alert('Failed to decrypt one or more items for export. Export aborted.');
        return;
      }
    }
    const payload = { version:1, exportedAt:new Date().toISOString(), folders, images };
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gallery-export-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    a.click();
  }

  async function handleImport(file){
    try{
      const text = await file.text();
      const payload = JSON.parse(text);
      if(!payload || !Array.isArray(payload.images)) throw new Error('Invalid file');

      // import folders first (preserve/create and map old folder ids to new ones)
      const oldToNew = {};
      if(Array.isArray(payload.folders)){
        for(const f of payload.folders){ const newid = createFolder(f.name||'Imported'); oldToNew[f.id] = newid; }
      }

      for(const img of payload.images){
        // convert dataURL to blob
        const blob = await (await fetch(img.dataURL)).blob();
        const ab = await blobToArrayBuffer(blob);
        const enc = await encryptArrayBuffer(ab);
        const mappedFolder = img.folderId ? (oldToNew[img.folderId] || null) : null;
        const rec = { id: uid(), name: img.name||'imported-image', type: blob.type||img.type||'image/*', size: blob.size||img.size, lastModified: img.lastModified||Date.now(), addedAt: Date.now(), cipher: enc.cipher, iv: enc.iv, folderId: mappedFolder };
        await putImageRecord(rec);
      }
      selections.clear();
      await refresh();
      alert(`Imported ${payload.images.length} image(s).`);
    }catch(err){
      console.error(err); alert('Import failed: '+ err.message);
    }
  }

  // blob -> dataURL (used for export)
  function blobToDataURL(blob){
    return new Promise((resolve,reject)=>{ const fr = new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>reject(fr.error); fr.readAsDataURL(blob); });
  }

  // ------------------ Ingest Files (encrypt before store) -----------
  async function ingestFiles(fileList, targetFolderId=null){
    const files = Array.from(fileList).filter(f=> f.type && f.type.startsWith('image/'));
    if(files.length===0){ alert('Please choose image files (including GIFs).'); return; }
    for(const f of files){
      const ab = await blobToArrayBuffer(f);
      const enc = await encryptArrayBuffer(ab);
      const rec = { id: uid(), name: f.name, type: f.type, size: f.size, lastModified: f.lastModified, addedAt: Date.now(), cipher: enc.cipher, iv: enc.iv, folderId: targetFolderId };
      await putImageRecord(rec);
    }
    await refresh();
  }

  // ------------------ Event wiring -----------------------------
  fileInput.addEventListener('change', e=>{ if(e.target.files?.length) ingestFiles(e.target.files, currentFolderId && currentFolderId !== '__unsorted__' ? currentFolderId : null); e.target.value=''; });
  importInput.addEventListener('change', e=>{ if(e.target.files?.length) handleImport(e.target.files[0]); e.target.value=''; });

  dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e=>{ e.preventDefault(); dropzone.classList.remove('dragover'); if(e.dataTransfer.files?.length) ingestFiles(e.dataTransfer.files, currentFolderId && currentFolderId !== '__unsorted__' ? currentFolderId : null); });

  selectAllBtn.addEventListener('click', async ()=>{ const items = await getAllRecords(); selections = new Set(items.map(i=>i.id)); refresh(); });

  clearSelBtn.addEventListener('click', async ()=>{ if(!selections.size) return; if(!confirm(`Delete ${selections.size} selected item(s)?`)) return; for(const id of selections){ await deleteImageRecord(id); } selections.clear(); refresh(); });

  clearAllBtn.addEventListener('click', async ()=>{ if(!confirm('Delete ALL images?')) return; const store = txObjectStore('readwrite'); store.clear(); selections.clear(); refresh(); });

  exportSelBtn.addEventListener('click', async ()=>{ if(selections.size) exportByIds(Array.from(selections)); });
  exportAllBtn.addEventListener('click', async ()=>{ const items = await getAllRecords(); if(items.length) exportByIds(items.map(i=>i.id)); });

  createFolderBtn.addEventListener('click', ()=>{ const name = (newFolderNameInput.value||'').trim(); if(!name){ alert('Enter folder name'); return; } createFolder(name); newFolderNameInput.value=''; });

  renameFolderBtn.addEventListener('click', ()=>{
    const f = folders.find(ff=>ff.id===currentFolderId);
    if(!f) return; const name = prompt('Rename folder', f.name); if(name===null) return; if(!name.trim()) return alert('Folder name cannot be empty'); renameFolder(f.id, name.trim()); renderFolderPills();
  });

  deleteFolderBtn.addEventListener('click', async ()=>{
    const f = folders.find(ff=>ff.id===currentFolderId);
    if(!f) return; if(!confirm(`Delete folder "${f.name}" and move its images to Unsorted?`)) return; await deleteFolder(f.id); currentFolderId = null; renderFolderPills(); refresh();
  });

  moveToSelect.addEventListener('change', async ()=>{
    const val = moveToSelect.value; if(!val) return; const target = val==='__unsorted__'? null : val; if(!selections.size) return alert('No items selected'); if(!confirm(`Move ${selections.size} item(s) to "${val==='__unsorted__'?'Unsorted': (folders.find(f=>f.id===val)||{}).name }"?`)) { moveToSelect.value=''; return; }
    for(const id of selections){ const it = await txObjectStore('readonly').get(id); if(it.result){ const r = it.result; r.folderId = target; await putImageRecord(r); }}
    selections.clear(); moveToSelect.value=''; refresh();
  });

  // ------------------ Boot & Password prompt -------------------
  async function promptPasswordLoop(){
    while(true){
      const password = prompt('Enter password to unlock your encrypted gallery (choose a memorable password):');
      if(password === null){ alert('Cancelled. Page will still open but data cannot be decrypted without the password.'); return null; }
      try{
        await ensureSaltAndKey(password);
        const items = await getAllRecords();
        if(items.length === 0){ await loadFolders(); return password; }
        try{
          const test = items[0];
          await decryptToArrayBuffer(test.iv, test.cipher);
          await loadFolders();
          return password;
        }catch(e){ console.warn('Password failed to decrypt an item.', e); alert('Incorrect password for this gallery (or data corrupted). Please try again.'); }
      }catch(e){ console.error('Key derivation error', e); alert('Error deriving key — try again.'); }
    }
  }

  (async function init(){
    try{
      db = await openDB();
      await promptPasswordLoop();
      if('storage' in navigator && navigator.storage.persist){ try{ await navigator.storage.persist(); }catch{ /* ignore */ } }
      await refresh();
    }catch(err){ console.error('Init error', err); alert('Initialization failed: '+err.message); }
  })();

  </script>
</body>
</html>
